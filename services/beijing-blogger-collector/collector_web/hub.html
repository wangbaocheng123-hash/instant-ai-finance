<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0b1d3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="北极采集器">
    <title>北京内容采集中心</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/collector/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/collector/favicon-32.png">
    <link rel="manifest" href="/collector/manifest.webmanifest">
    <link rel="stylesheet" href="/collector/hub.css">
  </head>
  <body>
    <main>
      <div class="eyebrow">北京统一版本</div>
      <h1>内容采集中心</h1>
      <p class="lead">模型下载与多博主采集共用一个域名、一个主人登录和一个手机入口；后台任务仍然串行运行。</p>
      <div class="grid">
        <a href="/model">
          <span class="icon">模</span>
          <h2>模型下载器</h2>
          <p>视频采集、评论管理、作品资料与原有维护功能。</p>
          <strong>进入模型下载器 →</strong>
        </a>
        <a href="/collector/">
          <span class="icon">博</span>
          <h2>博主采集端</h2>
          <p>多博主标签、手动抓取设置、作品卡片与北京到新加坡传输状态。</p>
          <strong>进入博主采集端 →</strong>
        </a>
      </div>
      <div class="note">页面查看不会触发采集。模型下载和博主采集不会同时启动浏览器。</div>
    </main>
  </body>
</html>
