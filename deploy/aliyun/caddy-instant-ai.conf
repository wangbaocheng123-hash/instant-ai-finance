__SERVER_NAME__, grandpaamu.com {
	encode zstd gzip

	@api path /api/*
	header @api Cache-Control "no-store, max-age=0"
	@blogger_transfer path /internal/v1/transfers /internal/v1/transfers/*
	header @blogger_transfer Cache-Control "no-store, max-age=0"

	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options nosniff
		Referrer-Policy no-referrer
		X-Frame-Options DENY
		Permissions-Policy "camera=(), microphone=(), geolocation=()"
		-Server
	}

	reverse_proxy 127.0.0.1:18765 {
		header_up Host 127.0.0.1
		header_up X-Forwarded-Proto https
	}
}

www.grandpaamu.com {
	redir https://grandpaamu.com{uri} permanent
}
